name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  pico-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [pico, pico2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 079c6f39023649b154152db30f1d781e884879bc # Pico SDK 2.3.1
          path: pico-sdk
          submodules: recursive
      - name: Install Arm toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure ${{ matrix.board }}
        run: cmake -S hardware/pico -B build-pico -DPICO_BOARD=${{ matrix.board }} -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk
      - name: Build ${{ matrix.board }}
        run: cmake --build build-pico --config Release
